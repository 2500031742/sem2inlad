<!DOCTYPE html>
<html>
    <head><title>Registration and Login Application</title></head>
    <body>
        <h2 align="centre">Student registration and login</h2>
        <h2>Registration</h2>
        Name: <input type="text" id="name" placeholder="Enter your name"><br><br>
        Email: <input type="email" id="email" placeholder="Enter your email"><br><br>
        Password: <input type="password" id="password" placeholder="Enter your password"><br><br>
        Confirm Password: <input type="password" id="confirmPassword" placeholder="Confirm your password"><br><br>
        <button onclick="signup()">Register</button>
        <script>
            function signup() {
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    alert("Passwords do not match!");
                    return;
                }

                const user = { name, email, password };
                let users = JSON.parse(localStorage.getItem('users')) || [];
                users.push(user);
                localStorage.setItem('users', JSON.stringify(users));
                alert("Registration successful!");
            }
            </script>
        <button onclick="window.location.href='login.html'">Go to Login</button>
    </body>
</html>
